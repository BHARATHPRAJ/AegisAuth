name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify database migrations
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migration-ci.db
        run: alembic upgrade head
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - name: Start demo server
        env:
          DEMO_LOGIN_ENABLED: "true"
          SESSION_SECRET: ci-only-session-secret-change-me-before-deploy
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/aegisauth.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health/ready
      - name: Run browser journey
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q tests/e2e